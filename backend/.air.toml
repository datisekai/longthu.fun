root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  full_bin = "GIT_SHA=dev ./tmp/api"
  include_ext = ["go"]
  include_dir = ["cmd", "internal", "pkg"]
  exclude_dir = ["tmp", "bin", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = false

[misc]
  clean_on_exit = true
