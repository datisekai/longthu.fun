name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend pipeline ────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: longthu
          MYSQL_USER: longthu
          MYSQL_PASSWORD: longthu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          redact: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Go mod tidy
        run: go mod tidy

      - name: Generate sqlc
        run: |
          cd backend
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          sqlc generate

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
        env:
          DATABASE_URL: longthu:longthu@tcp(127.0.0.1:3306)/longthu?parseTime=true

  # ─── Frontend pipeline ─────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint 2>/dev/null || true

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: http://localhost:3000
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
        env:
          LHCI_BUILD_CONTEXT__WEBSERVER_PORT: 3000
          LHCI_BUILD_CONTEXT__WEBSERVER_CMD: pnpm preview --port 3000 --host

  # ─── Docker build sanity check ─────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: longthu-backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: longthu-frontend:test
